---
layout: default
---
<article class="post">
  {%- if page.owner_id -%}
  <p class="back-link"><a href="{{ '/teams/' | relative_url }}">← All owners</a></p>
  {%- endif -%}
  {%- if page.title -%}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {%- endif -%}
  <div class="post-content">
    {{ content }}
  </div>
</article>
