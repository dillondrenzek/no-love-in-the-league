    blurb: 'In Week 3 I called Jono a .500 team pretending to be dangerous, and he''s
      gone 3-0 since, so I''d like to amend that to a .500 team that''s very good
      at pretending. The numbers say both things: 4-2 with only the sixth-most points,
      a 37-29 all-play, and he''s scored 724.2 while giving up 724.0, **a two-tenths-of-a-point
      cushion for an entire half**. Christian McCaffrey and Josh Allen are carrying
      the roster, and the waiver wire has mostly been a revolving door of defenses.
      The bad news is the road, **the second-toughest in the league**, with four games
      against the current top six and **the three biggest packed into four weeks**.
      Week 9 is Zach, a team he beat by 31 and owns 17-9 all-time, with Aaron Rodgers
      and his defense on bye; Week 10 is Nate, an 11-11 series, the most even on his
      schedule; and Week 12 is the rematch with Jack, who beat him by 63 on opening
      day. Then, in Week 13, **the marital rematch with Lexi**, after he won the first
      one by 1.1 points, and I hope the house is ready. At 72% he''s in for now, but
      this is the stretch that finds out whether the pretending holds up.

      '
