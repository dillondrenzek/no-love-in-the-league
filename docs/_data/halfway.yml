      of: 12
      opp_avg: 108.7
      color: '#fdf3e0'
    blurb: 'The reigning champ **set the all-time single-week record with 193.7**
      in Week 5 and has the second-most points in the league, but a 43-22-1 all-play
      says this has been a very good team, not an unbeatable one. Nobody works the
      waiver wire harder, with 39 pickups, and the trades have been busier than they''ve
      been productive: Garrett Wilson came in from Dillon and went right back out
      to Zach for Tee Higgins and George Kittle, and **Higgins has yet to score a
      point for Jack**. It hasn''t mattered, and it might not, because Jack has the
      **easiest remaining schedule in the league**, with only two games against the
      current top six, and his worst bye week is already behind him: Jahmyr Gibbs,
      Tee Higgins, his kicker and his defense were all off in Week 6, the week Luke
      beat him. Weeks 8 and 9 are back-to-back against Dillon, his trade partner and,
      for one week, his team name. Week 11 is the rematch with Luke, this time with
      Gibbs in the lineup, and Week 12 is Jono, whom he buried by 63 on opening day.
      The one that should worry him is the finale, Zach in Week 14, **a team Jack
      is 4-12 against all-time**, with Higgins and Kittle on one side and Wilson on
      the other. I''ve got Jack and Wade in a dead heat for the top seed, and that
      last week might be what decides it.

      '
