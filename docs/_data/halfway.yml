      of: 12
      opp_avg: 109.4
      color: '#fce8c5'
    blurb: 'Wade started the year as The People''s Commissioner, promoted himself
      to God''s Commissioner in Week 5, and has the numbers to almost justify it:
      **the most points in the league and a 52-14 all-play**, the best of anyone.
      **Both of his losses came while scoring 144 or more**, so the 4-2 record, if
      anything, undersells a team that has been the best in the league week in and
      week out. Bryce Young off the waiver wire, with nearly 60 points as a starter,
      was the move that settled his quarterback question. The road ahead is the **second-easiest
      in the league**, with only three games against the current top six, so the real
      question is whether God gets the bye. Circle Week 9, the rematch with Nate,
      who hung 179.1 on him in Week 5, and Week 10 against Grant, the most dangerous
      team left on the schedule. The trap is Luke, who is somehow **11-5 all-time
      against Wade** and gets him twice, in Weeks 8 and 12, and the one bye problem
      on the calendar is Week 11 against Shawnee, with Jaxon Smith-Njigba and Blake
      Corum among four players off. I''ve got the commish locking up the bye, but
      if Luke steals one of those, it''s going to be a very long sermon.

      '
