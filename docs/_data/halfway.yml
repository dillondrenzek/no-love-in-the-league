  intro: 'Half a season in, the champ broke the all-time single-week record and still
    isn''t in first place, because the commissioner renamed his team after God and
    then started scoring like one. The reigning sacko is sitting at .500, the rookie
    has been better than her record and is riding a three-game skid, and Grant went
    from 0-2 to a contender. And Luke, two years removed from a title, is staring
    at a coin flip for the Sacko. Here''s where everybody stands at the break, and
    where they''re headed.

    '
  outlook: 'At the top, it''s a two-team league. Wade and Jack are both at 99% to
    make the playoffs, they''re roughly even for the bye and the Shiva, and they''ve
    drawn the two easiest second-half schedules in the league, so the real race between
    them is for the top seed. They don''t play each other again in the regular season,
    which means the first rematch could be in the playoffs, and I want that game.
    Behind them, four teams are fighting for the last four spots, all with odds between
    69% and 81%: Grant, Zach, Jono and Nate. Grant has the third-most points in the
    league and the easiest road of the four, so I''d be surprised to see him miss.
    With the sixth seed going to the top scorer outside the top five, points matter
    as much as wins down the stretch, and the final week has two games that could
    decide the bracket: Jack against Zach, and Grant against Nate.


    Then comes the bubble, where Kevin, Shawnee and Lexi are all between 26% and 31%,
    so one of them probably needs to knock off one of the four above them. My pick
    is Kevin, because his all-play record says he''s been a lot better than 2-3-1.
    Dillon and Trevor need a miracle at single-digit odds, and they''re both on Sacko
    watch with Luke, who''s a 50-50 shot to take the Sacko and has the toughest remaining
    schedule in the league. Somebody tell him the second half starts now.

    '
