      color: '#f49445'
    blurb: 'Zach beat Wade in a Week 1 shootout, I called this the best team in the
      league in Week 3, and a 4-2 record with a 41-25 all-play still backs that up.
      He''s also **the league''s most active trader, with five deals**, and the scorecard
      is mixed: Ashton Jeanty has given him 87 points as a starter since the Drake
      London trade, but Jared Goff has scored nearly three times as much for Dillon
      as Josh Downs has for Zach. The second half is where it gets harder, with the
      **fourth-toughest road in the league** and four games against the current top
      six. Weeks 8 and 9 are the stretch to watch, Grant, with Isaiah Likely and Cam
      Skattebo on bye, and then a rematch with Jono, the team that beat him by 31
      in Week 2 and owns a 17-9 all-time edge. Kevin twice, in Weeks 10 and 12, looks
      like a breather, though Kevin''s all-play says it isn''t. Then it closes with
      **the hardest two weeks of his year**: Nate in Week 13, with Ashton Jeanty,
      Josh Downs, Garrett Wilson and his defense all on bye, and Jack in Week 14,
      a team Zach is 12-4 against all-time and will face with Wilson in his lineup
      and Higgins and Kittle in Jack''s. At 79% he''s in good shape, but this is the
      team with **the most to lose if the trades stop working**.

      '
