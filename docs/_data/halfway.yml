  - fid: sturmanator15
    rank: 1
    team: God's Commissioner
    owner: Wade
    logo: https://g.espncdn.com/lm-static/logo-packs/core/DIS_Avengers_EndGame/DIS_Avengers_EndGame_Thanos.svg
