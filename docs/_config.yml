title: The League
description: Where there is no love — league history, standings, and records.

# This site uses its own layouts (docs/_layouts + docs/_includes) and its own
# stylesheet (assets/main.scss) — no Jekyll theme gem. Nav lives in
# _includes/header.html.

markdown: kramdown

# Don't process the tooling when building the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
