name: Daily site update

# Imports the current ESPN season and rebuilds docs/_data, then commits to main
# (GitHub Pages redeploys from /docs on main automatically). In-season only.
on:
  schedule:
    - cron: "0 12 * 9-12,1 *"   # ~7-8am ET daily, Sept–Jan
  workflow_dispatch:             # manual "Run workflow" button, any time

permissions:
  contents: write

concurrency:
  group: site-automation        # never overlap with the snapshot job / itself
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev.txt pulls the ESPN client from the PRIVATE
        # espn-fantasy-cli repo, so pip needs a token that can read it. CLI_REPO_TOKEN
        # is a PAT (or fine-grained token) with read access to that repo.
        env:
          CLI_REPO_TOKEN: ${{ secrets.CLI_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CLI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -r requirements.txt -r requirements-dev.txt
          git config --global --unset-all url."https://x-access-token:${CLI_REPO_TOKEN}@github.com/".insteadOf || true

      - name: Write ESPN cookies
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: printf "ESPN_S2='%s'\nESPN_SWID='%s'\n" "$ESPN_S2" "$ESPN_SWID" > .espn-cookies

      - name: Import current season + build
        run: scripts/update_season.sh

      - name: Commit & push if anything changed
        run: |
          rm -f .espn-cookies
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi
