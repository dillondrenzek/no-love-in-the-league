name: Weekly projection snapshot

# Captures the current week's ESPN projected scores BEFORE any game is played, so
# there's a durable "line" to compare results against later. Write-once per week
# (see scripts/snapshot_projections.py). Thursday afternoons, in-season only.
on:
  schedule:
    - cron: "0 20 * 9-12,1 4"   # ~3-4pm ET Thursday, Sept–Jan (before TNF)
  workflow_dispatch:             # manual capture, any time

permissions:
  contents: write

concurrency:
  group: site-automation        # share the group with the daily job so they queue
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The ESPN client lives in the PRIVATE espn-fantasy-cli repo; pip needs a
        # token that can read it (CLI_REPO_TOKEN — a PAT with read access).
        env:
          CLI_REPO_TOKEN: ${{ secrets.CLI_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CLI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install -r requirements.txt -r requirements-dev.txt
          git config --global --unset-all url."https://x-access-token:${CLI_REPO_TOKEN}@github.com/".insteadOf || true

      - name: Write ESPN cookies
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: printf "ESPN_S2='%s'\nESPN_SWID='%s'\n" "$ESPN_S2" "$ESPN_SWID" > .espn-cookies

      - name: Capture projection snapshot
        run: python3 scripts/snapshot_projections.py

      - name: Commit & push if a new snapshot was written
        run: |
          rm -f .espn-cookies
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projections
          if git diff --cached --quiet; then
            echo "No new snapshot (this week already captured)."
          else
            git commit -m "Projection snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
