# Completed trades this season (franchise-keyed). ESPN reveals a trade's
# contents only to its participants, so trades no merged account was in
# come through as `complete: false` with empty assets and just the
# accepting franchise — counted (shown as 'Trade Accepted'), but the
# players/picks are unknown. `trades_complete` is true only when every
# trade this season is fully detailed. `trades_known_for` lists the
# franchises whose manager cookie was merged: their count is EXACT even
# in an incomplete season (an undetailed trade is one they weren't in),
# while everyone else's count is a floor ('at least N'). Feed managers'
# cookies one at a time (import_espn.py --cookies FILE) to fill gaps — each
# trade's `id` is ESPN's trade id, used to merge imports without clobbering.
trades_complete: true
trades_known_for: []  # no manager cookie tied to a franchise
trades: []  # none this season

# Keepers this season (franchise-keyed): the player each team kept and the
# round it cost. From ESPN's draft; empty before the league kept players.
keepers: []

# Waiver / free-agent activity this season (franchise-keyed): adds, drops,
# and moves (adds + drops) per team. Adds and drops are league-wide on ESPN,
# so these counts are EXACT whenever fetched. `transactions_known` is false
# for seasons ESPN's transaction endpoint doesn't cover (very old years) —
# those seasons don't contribute to the all-time transaction records or the
# Tx/yr rate.
transactions_known: false
transactions: {}  # none fetched this season

