# Halfway report prose — 2026. Write it with the agent
# (agents/halfway-report.md) from recaps/2026-halfway.data.md, then rebuild.
# Markdown is fine. Teams are keyed by franchise id; the comment shows the
# team's rank at the halfway point.
intro: |
  Half a season in, the champ broke the all-time single-week record and still isn't in first place, because the commissioner renamed his team after God and then started scoring like one. The reigning sacko is sitting at .500, the rookie has been better than her record and is riding a three-game skid, and Grant went from 0-2 to a contender. And Luke, two years removed from a title, is staring at a coin flip for the Sacko. Here's where everybody stands at the break, and where they're headed.
outlook: |
  At the top, it's a two-team league. Wade and Jack are both at 99% to make the playoffs, they're roughly even for the bye and the Shiva, and they've drawn the two easiest second-half schedules in the league, so the real race between them is for the top seed. They don't play each other again in the regular season, which means the first rematch could be in the playoffs, and I want that game. Behind them, four teams are fighting for the last four spots, all with odds between 69% and 81%: Grant, Zach, Jono and Nate. Grant has the third-most points in the league and the easiest road of the four, so I'd be surprised to see him miss. With the sixth seed going to the top scorer outside the top five, points matter as much as wins down the stretch, and the final week has two games that could decide the bracket: Jack against Zach, and Grant against Nate.

  Then comes the bubble, where Kevin, Shawnee and Lexi are all between 26% and 31%, so one of them probably needs to knock off one of the four above them. My pick is Kevin, because his all-play record says he's been a lot better than 2-3-1. Dillon and Trevor need a miracle at single-digit odds, and they're both on Sacko watch with Luke, who's a 50-50 shot to take the Sacko and has the toughest remaining schedule in the league. Somebody tell him the second half starts now.
teams:
  sturmanator15: |   # 1. God's Commissioner
    Wade started the year as The People's Commissioner, promoted himself to God's Commissioner in Week 5, and has the numbers to almost justify it: **the most points in the league and a 52-14 all-play**, the best of anyone. **Both of his losses came while scoring 144 or more**, so the 4-2 record, if anything, undersells a team that has been the best in the league week in and week out. Bryce Young off the waiver wire, with nearly 60 points as a starter, was the move that settled his quarterback question. The road ahead is the **second-easiest in the league**, with only three games against the current top six, so the real question is whether God gets the bye. Circle Week 9, the rematch with Nate, who hung 179.1 on him in Week 5, and Week 10 against Grant, the most dangerous team left on the schedule. The trap is Luke, who is somehow **11-5 all-time against Wade** and gets him twice, in Weeks 8 and 12, and the one bye problem on the calendar is Week 11 against Shawnee, with Jaxon Smith-Njigba and Blake Corum among four players off. I've got the commish locking up the bye, but if Luke steals one of those, it's going to be a very long sermon.
  jackperkins74: |   # 2. Gibbed for your pleasure
    The reigning champ **set the all-time single-week record with 193.7** in Week 5 and has the second-most points in the league, but a 43-22-1 all-play says this has been a very good team, not an unbeatable one. Nobody works the waiver wire harder, with 39 pickups, and the trades have been busier than they've been productive: Garrett Wilson came in from Dillon and went right back out to Zach for Tee Higgins and George Kittle, and **Higgins has yet to score a point for Jack**. It hasn't mattered, and it might not, because Jack has the **easiest remaining schedule in the league**, with only two games against the current top six, and his worst bye week is already behind him: Jahmyr Gibbs, Tee Higgins, his kicker and his defense were all off in Week 6, the week Luke beat him. Weeks 8 and 9 are back-to-back against Dillon, his trade partner and, for one week, his team name. Week 11 is the rematch with Luke, this time with Gibbs in the lineup, and Week 12 is Jono, whom he buried by 63 on opening day. The one that should worry him is the finale, Zach in Week 14, **a team Jack is 4-12 against all-time**, with Higgins and Kittle on one side and Wilson on the other. I've got Jack and Wade in a dead heat for the top seed, and that last week might be what decides it.
  zachzoske: |   # 3. Tuten Your Mother, Respectfully
    Zach beat Wade in a Week 1 shootout, I called this the best team in the league in Week 3, and a 4-2 record with a 41-25 all-play still backs that up. He's also **the league's most active trader, with five deals**, and the scorecard is mixed: Ashton Jeanty has given him 87 points as a starter since the Drake London trade, but Jared Goff has scored nearly three times as much for Dillon as Josh Downs has for Zach. The second half is where it gets harder, with the **fourth-toughest road in the league** and four games against the current top six. Weeks 8 and 9 are the stretch to watch, Grant, with Isaiah Likely and Cam Skattebo on bye, and then a rematch with Jono, the team that beat him by 31 in Week 2 and owns a 17-9 all-time edge. Kevin twice, in Weeks 10 and 12, looks like a breather, though Kevin's all-play says it isn't. Then it closes with **the hardest two weeks of his year**: Nate in Week 13, with Ashton Jeanty, Josh Downs, Garrett Wilson and his defense all on bye, and Jack in Week 14, a team Zach is 12-4 against all-time and will face with Wilson in his lineup and Higgins and Kittle in Jack's. At 79% he's in good shape, but this is the team with **the most to lose if the trades stop working**.
  schirmerj: |   # 4. Return of the IDP
    In Week 3 I called Jono a .500 team pretending to be dangerous, and he's gone 3-0 since, so I'd like to amend that to a .500 team that's very good at pretending. The numbers say both things: 4-2 with only the sixth-most points, a 37-29 all-play, and he's scored 724.2 while giving up 724.0, **a two-tenths-of-a-point cushion for an entire half**. Christian McCaffrey and Josh Allen are carrying the roster, and the waiver wire has mostly been a revolving door of defenses. The bad news is the road, **the second-toughest in the league**, with four games against the current top six and **the three biggest packed into four weeks**. Week 9 is Zach, a team he beat by 31 and owns 17-9 all-time, with Aaron Rodgers and his defense on bye; Week 10 is Nate, an 11-11 series, the most even on his schedule; and Week 12 is the rematch with Jack, who beat him by 63 on opening day. Then, in Week 13, **the marital rematch with Lexi**, after he won the first one by 1.1 points, and I hope the house is ready. At 72% he's in for now, but this is the stretch that finds out whether the pretending holds up.
  gganoom: |   # 5. One Big Beautiful Dillbot
    My feelings about this team are a matter of public record, so I'll stick to the numbers. Grant started 0-2, I called him a playoff team anyway in Week 3, and he's 3-1 since, with **the third-most points in the league and the fewest allowed**. The 3-3 record undersells him: he's **0-2 in close games**, including a 0.2-point loss to Kevin with the winning points on the bench, and a 38-27-1 all-play says he should be a game or two better. Bijan Robinson, the first-round pick, has been the frustrating part, and the roster has mostly stayed as drafted, with just six pickups all year. The road is kind, the third-easiest in the league, and the big games are all chances to settle a score. Week 8 against Zach comes with Brock Purdy and Malik Nabers on bye, Week 9 is the revenge game against Shawnee, who beat him by 4.7 in the opener, and Week 10 is Wade, a team he's 0-2 against all-time. Week 11 against Lexi is the strangest game left on anybody's schedule, because **both teams have five players on bye**, Bijan Robinson among Grant's, so it's whoever has the better waiver wire. Weeks 12 and 13 are back-to-back against Dillon, a 7% team that would love nothing more than to play spoiler. Then the finale is Nate, whom Grant is **4-0 against all-time** and just beat by 39, possibly with a playoff spot on the line. At 81%, I'll make it official: **he's in**.
  whowonthelastsuperbowl: |   # 6. Trick or Trick It’s Mike Vick
    No team in this league is harder to read. Nate scored 179.1 to beat the commish in Week 5, then the week's low score, 67.1, the very next week, and **his all-play is exactly 33-33**, which is the most perfectly average thing I've ever seen. Davante Adams is now hurt, Derrick Henry turned in a 4.5 in that Week 6 dud, and the best pickup of the year has been Tyler Shough, so the roster is what it is. The second half won't sort him out gently: the fifth-toughest road, four games against the current top six, and five against teams with his record or a tie away from it. Shawnee twice is the series to watch, because she's 12-5 against him all-time, and Week 11 against Dillon is worse, **a 1-10 all-time series** that would get into anybody's head. Week 9 is the rematch with Wade, the team he hung 179.1 on. The byes don't help: Bucky Irving and Chris Godwin Jr. are among four players off for the Week 10 game against Jono, Drake Maye and Davante Adams are both off in Week 11, and **CeeDee Lamb and Brandon Aubrey sit out the finale**. That finale is Grant, who is 4-0 all-time against him and just beat him by 39, with a playoff spot possibly on the line. At 69% the odds like Nate a lot more than his history does, and honestly, **I have no idea which Nate shows up**.
  shawne2520997: |   # 7. Swift kick in the Dak
    The reigning sacko is **back to .500**, which is a win in itself. Shawnee opened 2-0, has won both of her close games, and the draft-day trade for Nico Collins has been worth it, with 62.5 points as a starter. But a 29-37 all-play says **the record is a little better than the team**, and the scoring has dropped off since that hot start, down to a Week 6 loss to Zach that finished 27 points under projection. The schedule is the story here, and it comes in one big wave. Week 8 against Lexi is a trap, with Nico Collins and David Montgomery among four players on bye, and then it's **Grant, Jack and Wade in Weeks 9 through 11**, the gauntlet that decides her season. Survive that, and it gets friendly fast: Nate in Week 12, a team she's 12-5 against all-time, then Luke and Trevor to finish, two teams she's a combined 16-5 against, although the Dallas bye takes Dak Prescott and George Pickens away for the Week 14 finale, so **the team name sits out the most important week of the year**. At 30% she needs to steal one game from the big three, and a team that just escaped the Sacko has every reason to want to stay out of that conversation for good.
  kevbots22: |   # 8. Remember the Nice Guys, ChatGPT
    Kevin has been **better than his record**, and I can prove it: 2-3-1 with a 37-28-1 all-play, the kind of gap that usually closes in the second half. He's lived in coin-flip games, with a tie against Dillon on opening day and a 0.2-point win over Grant, and Tre Tucker, a waiver pickup, has been the surprise of the roster. The catch is the schedule: **six of his eight games are against the current top six**, tied for the most in the league, and that's how a team with his all-play ends up at 31%. **Zach twice, in Weeks 10 and 12, is his whole case**, a 7-8 all-time series he needs to win at least once. His heavy bye weeks are mostly behind him, with Justin Jefferson and Chase Brown both off in Week 6, but Week 11 against Jono, whom Kevin owns 12-5 all-time, comes with Matthew Stafford and Josh Jacobs on bye. Week 13 is Wade, whom he very much does not own, at 4-19-1. If he's still alive for the finale, Luke in Week 14 is about as soft a landing as there is. He's still **my pick to crash the playoffs** from the bubble, but he's going to have to beat good teams to do it, and he renamed his team after a chatbot, which I've chosen not to take personally.
  theoceanpulse: |   # 9. The ChoSimba Ones
    Dillon's season in one sentence: a tie in Week 1, a win in Week 5 with a negative-six defense, and a 2-3-1 record that's honestly better than **a 21-44-1 all-play** says it should be. The trade log is long and mostly a wash: **the Jared Goff deal has paid off** with 74.5 points as a starter, but Nico Collins went to Shawnee on draft day, and Dillon took four players from Jack only to flip two of them to Zach two weeks later. The road doesn't help, the third-toughest in the league, with six games against the current top six. **Jack twice, back-to-back in Weeks 8 and 9**, is where the playoff hopes probably go to die, and it's also the first time the two trade partners have to face what they did. Then it's Grant twice, in Weeks 12 and 13, his best shot at playing spoiler, though Breece Hall and his kicker are on bye for the second one. The one to circle for fun is Week 11 against Nate, whom Dillon is **10-1 against all-time**. At 7% for the playoffs and 13% for the Sacko, the second half is probably about staying out of the basement, and Week 10 against Luke is **the one game he can't lose**, especially since Luke will be playing it without most of the Eagles.
  alexandra: |   # 10. Cornstar
    The rookie has had a rough introduction. Lexi beat Luke by 60 to get to 2-1, then **lost three straight**, including a 132.5 that ran into Jack's record-breaking 193.7 and a 1.1-point loss to Jono, and a 31-35 all-play says she's been a little unlucky on top of it. **Injuries have done the most damage**, with Lamar Jackson, Rashee Rice, Tyler Warren and Jeremiyah Love all missing time, and the waiver wire has been her best friend: Jordan Love, the quarterback Wade let go, has given her 48.4 points as a starter. The good news is the road, the fourth-easiest in the league, and the middle of it is soft. Week 8 is Shawnee, with four of Shawnee's players on bye, then Luke in Week 9, a team she beat by 60, and Trevor twice, in Weeks 10 and 12. That's **four winnable games in five weeks**, with Grant in Week 11 the one real test in the middle. **The byes, though, all land late**: five players off in Week 11, including Jordan Love, four in Week 13, including Lamar Jackson, against Jono, and three more in the Week 14 finale against Wade. So the rookie needs to bank those wins early, because the last four weeks are a fight with a short bench. At 26% she has a real shot if she gets healthy, and nobody near the cut line should want to see her coming.
  purpsworth: |   # 11. I am dead inside
    Trevor's best week of the season was **116.6, in a loss**, which tells you most of what you need to know, and a 20-46 all-play confirms it. The low point was Week 3, when **De'Von Achane tore his ACL**, a real blow to a team that didn't have much margin to begin with. To his credit, he's kept working the wire, with Deebo Samuel Sr., Ollie Gordon II and the Steelers D/ST all chipping in, but the Week 1 trade of Ashton Jeanty for Drake London has gone Zach's way, 87.4 to 72.9 as starters. The second half is a middle-of-the-pack road, and it's full of teams in the same mess. Week 9 is Kevin, whom he's already beaten once and leads 7-4 all-time, and then Lexi twice, in Weeks 10 and 12, **the two games most likely to decide which of them ends up in the Sacko conversation**. Week 11 against Zach is **the trade grudge match**, Jeanty against London, Week 13 against Jack is the bye-week problem, with Jonathan Taylor, Kirk Cousins and Mark Andrews all off, and Week 14 against Shawnee is a 1-8 all-time series he'd love to start fixing. At 5% for the playoffs and 15% for the Sacko, the team name is still accurate, but there's a lot of spoiling left to do.
  lukstein: |   # 12. 2x Runner Up
    It's been a long half for the Eagles fan. Luke went all in on Philadelphia, and Saquon Barkley, DeVonta Smith and Jalen Hurts have mostly left him stranded, which is how he's averaging 82.8 points a week, **by far the fewest in the league**, with a 12-54 all-play to match. Then, out of nowhere, he **beat the No. 1 team in the league as a 30-point underdog** in Week 6, with a free-agent C.J. Stroud and Kyle Pitts Sr. leading the way, so there's a pulse. The bad news is that he has **the toughest remaining schedule in the league**. The strange news is who's on it: Wade twice, in Weeks 8 and 12, and Luke is 11-5 all-time against the commish, so those might be his best chances at a win. Week 11 is the rematch with Jack, and Jack will remember. The games that actually decide his season are the ones against the Sacko crowd: Lexi in Week 9, a revenge game for the 60-point loss, and Dillon in Week 10, which is also the Eagles' bye week. Luke has seven players off that week, Barkley, Smith and the Eagles defense among them, **the heaviest bye week anybody has all year**, and he gets it in his most important game. At 50% for the Sacko, the all-in-on-Philly plan is about to send him its bill.
