  jackperkins74: "Still perfect. A 125 disposed of Nate and kept the champ unbeaten and unbothered atop the league. Week 4 is a real one, though: Wade, the points machine, in a series Jack leads 8-5."   # 1. Gibbed for your pleasure
  zachzoske: "Now the league's leading scorer at 404 total after dropping 136 on Shawnee — the Jeanty core is humming. One quiet week against Jono is the only blemish. He draws a reeling Luke next, a matchup he owns 12-8."   # 2. Tuten Your Mom
  sturmanator15: "Handled Dillon and keeps stacking points — nobody's scoring profile is steadier. The résumé says top three; the record is finally catching up. Week 4 is the measuring stick: the undefeated champ, who leads their series 8-5."   # 3. The People's Commissioner
  shawne2520997: "The dream start met reality in a 136-108 loss to Zach, but 2-1 from the preseason basement — with Nico Collins hurt the last two weeks — is still the story of the year. The depth keeps delivering without him. She gets Jono next, an owner who's had her number 8-5."   # 4. Swift kick in the Dak
  alexandra: "The rookie is for real — a 132-44 demolition of Luke pushed her to 2-1 and turned heads. Lamar plus a deepening cast is a problem. Week 4 brings a fresh-slate clash with winless Dillon."   # 5. Cornstar
  kevbots22: "The unbeaten label is gone, upset by winless Trevor in an ugly 82.8 dud — by far the worst week yet. Jefferson can't do it alone, and the schedule isn't apologizing. He'll try to reset against a suddenly-dangerous Grant."   # 6. Josh Jacobs Alibi
  gganoom: "Finally. Bijan and company erupted for a league-high 156 to bury Jono and put One Big Beautiful Dill on the board. If that's the real team, the 0-2 start was a mirage. A Week 4 date with a wounded Kevin (1-1 all-time) is a chance to keep rolling."   # 7. One Big Beautiful Dill
  whowonthelastsuperbowl: "Kept it close with the champ but couldn't finish, and the boom-or-bust ride is leaning bust at 1-2. Henry and CeeDee are carrying a heavy load. Week 4 is a nightmare draw: Trevor, who owns him 8-1."   # 8. Trick or Trick It's Mike Vick
  schirmerj: "Josh Allen's magic vanished in a 156-94 blowout loss to Grant — a jarring step back after the Week 2 statement. The talent is real; the consistency isn't. He gets Shawnee next, a series he leads 8-5, to steady the ship."   # 9. Return of the IDP
  purpsworth: "On the board at last, stunning previously-unbeaten Kevin for a first win the roster badly needed. Taylor and Achane still aren't right, but a win's a win. And Week 4 is a gift: Nate, whom Trevor owns 8-1."   # 10. I am dead inside
  theoceanpulse: "Still searching for a first win after an 88-point loss to Wade dropped him to 0-2-1 — the offense has cratered since Caleb Williams went down — the Goff pickup was the insurance move, and it hasn't sparked it yet. He needs the fill-ins to hold up. A winnable Week 4 against rookie Lexi is the spot to finally break through."   # 11. The ChoSimba Ones
  lukstein: "A stunning 44.5 — the worst score of the season by anyone — in a blowout loss to a rookie. The two-time runner-up's roster looks broken behind Hurts and Saquon. It doesn't get kinder: Zach, who leads their series 12-8, is next."   # 12. 2x Runner Up
