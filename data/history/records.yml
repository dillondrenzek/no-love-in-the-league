# Single-game and season record book. Add a new entry any time a record
# is broken; keep the old one too if you want a "previous record" trail,
# or just replace it if you only want the current holder.
#
# Fields:
#   category: name of the record, e.g. "Most Points in a Single Week"
#   holder:   team name that holds the record
#   value:    the record value, as a display string (e.g. "189.42")
#   season:   year the record was set
#   week:     week number, if applicable (omit for season-long records)

- category: "Most Points in a Single Week"
  holder: "Sample Team A"
  value: "189.42"
  season: 2025
  week: 7

- category: "Fewest Points in a Single Week"
  holder: "Sample Team B"
  value: "58.10"
  season: 2024
  week: 3

- category: "Longest Win Streak"
  holder: "Sample Team C"
  value: "9 games"
  season: 2024
